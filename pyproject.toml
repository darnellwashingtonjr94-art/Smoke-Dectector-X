[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smoke-detector-x"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "Edge-AI smart home safety device combining smoke detection with 360-degree YOLOv8 visual verification."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ultralytics==8.1.0",
    "opencv-python-headless==4.9.0.80",
    "numpy==1.26.4",
    "PyYAML==6.0.1",
    "requests==2.31.0",
    "RPi.GPIO==0.7.1; platform_machine=='armv7l' or platform_machine=='aarch64'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
